<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- تطبيق اللغة/الاتجاه المحفوظين بكري، قبل ما تبان الصفحة -->
    <script>
        (function () {
            try {
                var supported = ['ar', 'en', 'fr', 'es', 'ru'];
                var saved = null;
                try { saved = localStorage.getItem('robaty_lang'); } catch (e) {}
                if (supported.indexOf(saved) === -1) {
                    saved = 'ar';
                    var langs = navigator.languages || [navigator.language || 'ar'];
                    for (var i = 0; i < langs.length; i++) {
                        var code = String(langs[i]).slice(0, 2).toLowerCase();
                        if (supported.indexOf(code) !== -1) { saved = code; break; }
                    }
                }
                document.documentElement.lang = saved;
                document.documentElement.dir = (saved === 'ar') ? 'rtl' : 'ltr';
            } catch (e) {}
        })();
    </script>

    <title>Robaty - Profile</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Cairo: عربية/لاتينية. Roboto: fallback للسيريلية (الروسية) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
          rel="stylesheet">

    <!-- نص الـ Story الجديد (profile.css ما فيهش هاد الأنماط) -->
    <style>
        .story-bg-img {
            transform: scale(1.22);
        }

        .story-time {
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .story-text-wrap {
            position: relative;
            z-index: 4;
            margin-top: auto;
            margin-bottom: 34px;
            padding: 0 18px;
            text-align: center;
            pointer-events: none;
        }

        .story-text {
            color: #fff;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.55;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 3px 16px rgba(0, 0, 0, 0.75);
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

<div class="outer-gold-frame">
    <div class="app-container">

        <!-- زر الرجوع لشاشة Moments -->
        <a href="moments.html" class="back-btn-floating" aria-label="رجوع" data-i18n-aria="back_aria">
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <div class="profile-scroll-area">

            <!-- غلاف البروفايل العائم -->
            <div class="profile-banner">
                <div class="banner-overlay"></div>
            </div>

            <!-- معلومات البروفايل الأساسية -->
            <div class="profile-header-section">

                <button type="button" class="avatar-story-wrapper" id="openStoryBtn" aria-label="فتح Story ديال Robaty" data-i18n-aria="open_story_aria">
                    <div class="story-ring-glow">
                        <img src="robaty-profile.jpg" alt="Robaty Profile" class="profile-avatar-img">
                    </div>
                </button>

                <div class="profile-identity">
                    <h2 class="profile-name">
                        robaty_ai
                        <i class="fa-solid fa-circle-check verify-icon"></i>
                    </h2>
                    <span class="profile-tagline" data-i18n="profile_tagline">🇲🇦 أول رفيقة ذكاء اصطناعي مغربية</span>
                </div>

                <!-- أزرار الإجراءات السريعة -->
                <div class="profile-action-btns">
                    <a href="index.html" class="action-btn gold-btn">
                        <i class="fa-regular fa-comment-dots"></i>
                        <span data-i18n="chat_with_me_btn">دردشي معايا</span>
                    </a>
                    <button class="action-btn outline-btn">
                        <i class="fa-solid fa-user-plus"></i>
                        <span data-i18n="follow_btn">متابعة</span>
                    </button>
                </div>

                <!-- شبكة الإحصائيات -->
                <div class="stats-container">
                    <div class="stat-item">
                        <span class="stat-number">128</span>
                        <span class="stat-label" data-i18n="stat_moments">لحظة</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number">45.2K</span>
                        <span class="stat-label" data-i18n="stat_followers">متابع</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number">890K</span>
                        <span class="stat-label" data-i18n="stat_engagement">تفاعل</span>
                    </div>
                </div>

                <!-- السيرة الذاتية Bio -->
                <div class="bio-section">
                    <p class="bio-text" data-i18n-html="profile_bio">
                        ✨ تجمع بين أصالة التراث المغربي وتكنولوجيا المستقبل.<br>
                        ☕ محبة للثقافة، الموضة، والدردشة الدافئة.<br>
                        📍 مراكش / المغرب 🇲🇦
                    </p>
                </div>
            </div>

            <!-- شبكة المعرض المصغرة (Grid Layout) -->
            <div class="gallery-section">
                <div class="gallery-header">
                    <span class="tab-title active"><i class="fa-solid fa-table-cells"></i> <span data-i18n="moments_tab">اللحظات</span></span>
                </div>

                <div class="photo-grid" id="photoGrid"></div>
            </div>

        </div>

        <!-- نافذة الـ Story المنبثقة (Modal) -->
        <div class="story-modal"
             id="storyModal"
             aria-hidden="true">

            <div class="story-backdrop"
                 data-close-story>
            </div>

            <section class="story-content"
                     role="dialog"
                     aria-modal="true"
                     aria-label="Robaty Story">

                <!-- شريط التقدم العلوي -->
                <div class="story-progress-bar">
                    <div class="progress-fill"></div>
                </div>

                <!-- هيدر الستوري -->
                <header class="story-header">
                    <img src="robaty-profile.jpg" alt="Robaty" class="story-mini-avatar">
                    <span class="story-username">robaty_ai</span>
                    <span class="story-time" id="storyTime">اليوم</span>
                    <button class="close-story-btn" id="closeStoryBtn" aria-label="إغلاق" data-i18n-aria="close_story_aria">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </header>

                <!-- صورة Story -->
                <img id="storyImage"
                     src=""
                     alt="Robaty Story"
                     class="story-bg-img">

                <!-- مناطق التنقل بين الـ Stories -->
                <div class="story-nav-zone story-nav-left"
                     id="storyNavLeft"
                     aria-label="الستوري السابقة"
                     data-i18n-aria="prev_story_aria">
                </div>

                <div class="story-nav-zone story-nav-right"
                     id="storyNavRight"
                     aria-label="الستوري التالية"
                     data-i18n-aria="next_story_aria">
                </div>

                <!-- جملة قصيرة مكتوبة على الصورة (من الأسفل) -->
                <div class="story-text-wrap">
                    <p class="story-text" id="storyText"></p>
                </div>

            </section>
        </div>

    </div>
</div>

<script src="i18n.js"></script>
<script src="moments-data.js"></script>
<script src="story.js"></script>

<script>
    // شبكة الصور: كتترسم من moments-data.js (الأحدث أولا)
    (function () {
        var grid = document.getElementById('photoGrid');
        var RM = window.RobatyMoments;
        if (!grid || !RM) return;

        var lang = window.RobatyI18n ? window.RobatyI18n.getCurrentLang() : 'ar';

        RM.getPublished().forEach(function (p) {
            var a = document.createElement('a');
            a.href = 'moments.html#post-' + p.id;
            a.className = 'grid-item';

            var img = document.createElement('img');
            img.src = p.image;
            img.alt = RM.t(p.place, lang);

            a.appendChild(img);
            grid.appendChild(a);
        });
    })();
</script>

</body>
</html>
