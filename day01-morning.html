<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robaty — شفشاون، لحظة الصباح</title>

<!-- ===== Open Graph: هادو هوما اللي كيقراو واتساب/فيسبوك/تيليغرام باش يبنيو المعاينة ===== -->
<meta property="og:title" content="Robaty — شفشاون، لحظة الصباح 💙">
<meta property="og:description" content="شفشاون كتلبس الزرقة من الصباح 💙 وكل زقاق فيها عندو حكاية صغيرة. اليوم نسّقت blazer عصري بلمسة سفيفة مغربية.">
<meta property="og:image" content="https://simo-amylo.github.io/Robaty-2/day01-chefchaouen-morning.jpg">

<meta name="twitter:card" content="summary_large_image">

<style>
    :root {
        --gold: #e5b35c;
        --bg: #14100c;
        --surface: #1e1712;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        color: #fff;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex;
        justify-content: center;
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .page {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
    }

    .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        background: var(--surface);
        border-bottom: 1px solid rgba(229,179,92,0.35);
        position: sticky;
        top: 0;
        z-index: 5;
    }

    .top-bar span {
        font-weight: 700;
        font-size: 14px;
        color: var(--gold);
    }

    .download-btn {
        background: var(--gold);
        color: #1a1409;
        font-weight: 700;
        font-size: 12px;
        padding: 8px 14px;
        border-radius: 20px;
        text-decoration: none;
        white-space: nowrap;
    }

    .hero-img {
        width: 100%;
        display: block;
    }

    .caption {
        padding: 16px;
        font-size: 14px;
        line-height: 1.8;
        color: #f2f2f2;
    }

    .actions {
        padding: 0 16px 24px;
        display: grid;
        gap: 10px;
    }

    .open-chat-btn {
        display: block;
        text-align: center;
        background: linear-gradient(135deg, var(--gold), #c99544);
        color: #1a1409;
        font-weight: 700;
        font-size: 14px;
        padding: 13px;
        border-radius: 18px;
        text-decoration: none;
    }
</style>
</head>
<body>

<div class="page">

    <div class="top-bar">
        <span>Robaty ✦</span>
        <a class="download-btn" href="https://robaty.com" target="_blank" rel="noopener">
            📲 حمّلي التطبيق
        </a>
    </div>

    <img class="hero-img"
         src="../day01-chefchaouen-morning.jpg"
         alt="Robaty فشفشاون">

    <p class="caption">
        شفشاون كتلبس الزرقة من الصباح 💙<br>
        وكل زقاق فيها عندو حكاية صغيرة.<br>
        ألوان المدينة ولات جزءًا من هويتها البصرية.<br>
        اليوم نسّقت blazer عصري بلمسة سفيفة مغربية.<br>
        واش اللوك نجح؟ أنا كنقول آه… بلا غرور 😂<br>
        التحدي والتصويت كاينين فـ Story 👀
    </p>

    <div class="actions">
        <a class="open-chat-btn" href="../index.html">
            💬 افتحي المحادثة مع Robaty
        </a>
    </div>

</div>

</body>
</html>
