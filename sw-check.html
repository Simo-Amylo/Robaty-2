<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robaty — فحص الكاش</title>
<style>
  body{margin:0;padding:18px;background:#000;color:#f2f2f2;font:15px/1.7 system-ui,sans-serif}
  h1{font-size:18px;color:#e5b35c;margin:0 0 12px}
  pre{white-space:pre-wrap;word-break:break-all;background:#111;border:1px solid #333;border-radius:10px;padding:12px;font-size:13px}
  button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;background:#e5b35c;color:#000}
  button.alt{background:#222;color:#f2f2f2;border:1px solid #444}
</style>
</head>
<body>
<h1>🔎 فحص كاش Robaty</h1>
<pre id="out">كنفحص...</pre>
<button id="fix">🧹 مسح الكاش وفتح الموقع من جديد</button>
<button class="alt" id="again">إعادة الفحص</button>
<script>
var out = document.getElementById('out');
function log(t){ out.textContent += '\n' + t; }

async function grab(url, opts){
  try {
    var r = await fetch(url, opts);
    return { ok: r.ok, status: r.status, text: await r.text() };
  } catch (e) { return { ok: false, status: 'ERR', text: '' }; }
}

async function run(){
  out.textContent = '';
  if ('serviceWorker' in navigator) {
    var regs = await navigator.serviceWorker.getRegistrations();
    log('Service Workers: ' + (regs.length || 'لا شي'));
    regs.forEach(function(r){
      var w = r.active || r.waiting || r.installing;
      log(' • ' + (w ? w.scriptURL.split('/').pop() : '?'));
    });
  }
  if (window.caches) log('Caches: ' + ((await caches.keys()).join(' , ') || 'لا شي'));

  var t = '?t=' + Date.now();
  log('\n— الملفات الحقيقية على الموقع (الشبكة) —');
  var h = await grab('moments.html' + t, { cache: 'no-store' });
  var m = h.text.match(/<script src="(comments[^"]*)"/);
  log('moments.html: ' + h.status + ' ← كيحمل: ' + (m ? m[1] : '؟'));
  var j = await grab('comments-v2.js' + t, { cache: 'no-store' });
  log('comments-v2.js: ' + j.status + ' ← فيه زر الرد: ' + (j.text.indexOf('comment-reply-btn') > -1 ? 'إيه ✅' : 'لا ❌'));
  var c = await grab('comments-ig.css' + t, { cache: 'no-store' });
  log('comments-ig.css: ' + c.status);

  log('\n— اللي كيوصل لهاتفك دابا —');
  var h2 = await grab('moments.html');
  var m2 = h2.text.match(/<script src="(comments[^"]*)"/);
  log('moments.html (عادي): كيحمل ← ' + (m2 ? m2[1] : '؟'));
  var verdict = (m && m2 && m[1] !== m2[1]) ? '\n⚠️ هاتفك كيشوف نسخة قديمة ← اضغط "مسح الكاش".' : '\n✅ نفس النسخة.';
  log(verdict);
}

document.getElementById('again').onclick = run;
document.getElementById('fix').onclick = async function(){
  if ('serviceWorker' in navigator) {
    (await navigator.serviceWorker.getRegistrations()).forEach(function(r){ r.unregister(); });
  }
  if (window.caches) { (await caches.keys()).forEach(function(k){ caches.delete(k); }); }
  setTimeout(function(){ location.href = 'moments.html?fresh=' + Date.now(); }, 600);
};
run();
</script>
</body>
</html>
