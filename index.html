<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- تطبيق اللغة/الاتجاه المحفوظين بكري، قبل ما تبان الصفحة (يمنع فلاش الاتجاه الغالط) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('robaty_lang');
                if (saved) {
                    document.documentElement.lang = saved;
                    document.documentElement.dir = (saved === 'ar') ? 'rtl' : 'ltr';
                }
            } catch (e) {}
        })();
    </script>

    <title>Robaty - Moroccan Luxury UI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'"
    >

    <!-- Cairo: عربية/لاتينية. Roboto: زايدة كـ fallback باش تغطي السيريلية (الروسية) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
        media="print" onload="this.media='all'"
    >

    <style>
/* === Splash === */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #14100c;               /* نفس background_color في manifest */
    overflow: hidden;
    transition: opacity .35s ease, transform .35s ease;
  }
  #splash.leaving { opacity: 0; transform: scale(1.03); pointer-events: none; }

  /* الهالة الذهبية (كما هي) */
  .splash-glow {
    position: absolute; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(229,179,92,.30) 0%, rgba(229,179,92,.10) 45%, transparent 70%);
    opacity: 0;
  }
  #splash.go .splash-glow { animation: glow 1.6s ease-out .3s forwards; }
  @keyframes glow {
    0%   { opacity: 0; transform: scale(.7); }
    60%  { opacity: 1; transform: scale(1.05); }
    100% { opacity: .75; transform: scale(1); }
  }

  /* 0 → 1s : الصورة (234px = 130 + 80%) */
  .splash-logo {
    position: relative; width: 234px; height: 234px; object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 0 36px rgba(229,150,60,.28);
    opacity: 0; transform: scale(.92);
  }
  #splash.go .splash-logo { animation: logoIn 1s cubic-bezier(.2,.7,.2,1) 0s forwards; }
  @keyframes logoIn { to { opacity: 1; transform: scale(1); } }

  /* 1 → 2s : الاسم (41px = 34 + 20%) */
  .splash-name {
    position: relative; margin: 22px 0 0;
    font: 600 41px/1.1 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .04em; color: #f5ecdc; direction: ltr;
    opacity: 0; transform: translateY(6px);
  }
  .splash-name span { color: #e5b35c; }
  #splash.go .splash-name { animation: rise 1s ease 1s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* 2 → 4s : الجملة (20.4px = 17 + 20%) */
  .splash-tagline {
    position: relative; margin: 12px 0 0; display: flex; align-items: center; gap: 10px;
    font: 400 20.4px/1.4 "Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    color: #f5ecdc;
    clip-path: inset(0 0 0 100%);
  }
  html[dir="ltr"] .splash-tagline { clip-path: inset(0 100% 0 0); }
  #splash.go .splash-tagline { animation: reveal 2s steps(24, end) 2s forwards; }
  @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
  .splash-flag { width: 26px; height: 18px; border-radius: 2px; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    #splash .splash-glow, #splash .splash-logo, #splash .splash-name, #splash .splash-tagline {
      animation: none; opacity: 1; transform: none; clip-path: none;
    }
    #splash { transition: opacity .2s ease; }
    #splash.leaving { transform: none; }
  }
</style>

</head>

<body>

<!-- Splash screen -->
<div id="splash" aria-hidden="true">
  <div class="splash-glow"></div>
  <img class="splash-logo" src="calm.png" alt="">
  <h1 class="splash-name">Ro<span>baty</span></h1>
  <p class="splash-tagline">
    <span data-i18n="splash_tagline">سفيرة التراث المغربي</span>
    <svg class="splash-flag" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
      <rect width="30" height="20" fill="#c1272d"/>
      <path d="M15 5.2l2.3 7.1-6-4.4h7.4l-6 4.4z" fill="none" stroke="#006233" stroke-width="1"/>
    </svg>
  </p>
</div>
<script>
(function () {
  var splash = document.getElementById('splash');
  if (!splash) return;
  var started = false;

  function finish() {
    splash.classList.add('leaving');
    setTimeout(function () {
      splash.remove();
      document.dispatchEvent(new Event('splash:done'));
    }, 380);
  }

  function start() {
    if (started) return;
    started = true;
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // ننتظر إطارين ليكون السبلاش ظاهراً فعلاً قبل بدء الأنيميشن
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        splash.classList.add('go');
        setTimeout(finish, reduced ? 600 : 5300);   // 1s صورة + 1s اسم + 2s جملة + 1.3s انتظار
      });
    });
  }

  var img = splash.querySelector('.splash-logo');
  if (img && img.decode) { img.decode().then(start, start); } else { start(); }
  setTimeout(start, 1500);  // احتياط
})();
</script>


<div class="outer-gold-frame">

    <!-- GOLDEN FRAME GLINT -->

    <div
        class="golden-ambient-glow"
        aria-hidden="true"
    ></div>


    <div class="app-container">

        <div class="corner-ornament top-left"></div>
        <div class="corner-ornament top-right"></div>
        <div class="corner-ornament bottom-left"></div>
        <div class="corner-ornament bottom-right"></div>


        <!-- TOP BAR -->

        <header class="top-bar">

            <button
                type="button"
                class="ornate-btn"
                id="backButton"
                aria-label="رجوع"
                data-i18n-aria="back_button_aria"
            >
                <i class="fa-solid fa-arrow-right"></i>
            </button>


            <div class="top-bar-right-group">

                <button
                    type="button"
                    class="ornate-btn ornate-btn-danger"
                    id="resetMemoryButton"
                    aria-label="مسح الذاكرة (مؤقت، للاختبار)"
                    title="مسح الذاكرة (مؤقت، للاختبار)"
                    data-i18n-aria="reset_memory_aria"
                    data-i18n-title="reset_memory_aria"
                >
                    <i class="fa-solid fa-trash"></i>
                </button>

                <button
                    type="button"
                    class="ornate-btn"
                    id="settingsButton"
                    aria-label="الإعدادات"
                    data-i18n-aria="settings_aria"
                >
                    <i class="fa-solid fa-gear"></i>
                </button>

            </div>

        </header>


        <!-- ROBATY PROFILE -->

        <section class="profile-section">

            <div class="avatar-container">

                <div class="zellige-mandala"></div>

                <div class="glowing-ring">

                    <div class="avatar-inner">

                        <img
                            id="avatarImgA"
                            src="robaty-profile.jpg"
                            alt="Robaty"
                            class="avatar-img is-active"
                        >

                        <img
                            id="avatarImgB"
                            alt="Robaty"
                            class="avatar-img"
                        >

                    </div>

                </div>

            </div>


            <div class="identity-info">

                <h1 class="bot-name">

                    <span
                        class="neon-target-ring"
                        id="presenceIndicator"
                    ></span>

                    Robaty

                </h1>


                <div class="divider-line">

                    <span class="line"></span>

                    <span class="tagline-star">۞</span>

                    <p class="tagline" data-i18n="tagline">
                        🇲🇦 مغربية و أفتخر
                    </p>

                    <span class="tagline-star">۞</span>

                    <span class="line"></span>

                </div>

            </div>


            <a
                href="moments.html"
                class="gold-pill-btn"
            >

                <i class="fa-regular fa-image"></i>

                <span data-i18n="view_moments_btn">شوفي تصاوري ليوم</span>

            </a>

        </section>


        <!-- CHAT AREA -->

        <main
            class="chat-area"
            id="chatArea"
        >

            <!-- الرسائل كتتزاد هنا ديناميكياً من app.js -->

        </main>


        <!-- BOTTOM CONTROLS -->

        <footer class="bottom-controls">

            <div class="input-wrapper">

                <!-- IMAGE THUMBNAIL -->

                <div
                    class="image-preview"
                    id="imagePreview"
                    aria-hidden="true"
                >

                    <img
                        id="previewImage"
                        src=""
                        alt="الصورة المختارة"
                        data-i18n-alt="selected_image_alt"
                    >

                    <button
                        type="button"
                        class="remove-image-btn"
                        id="removeImageBtn"
                        aria-label="حذف الصورة"
                        data-i18n-aria="remove_image_aria"
                    >

                        <i class="fa-solid fa-xmark"></i>

                    </button>

                </div>


                <!-- MESSAGE INPUT -->

                <textarea
                    placeholder="اكتبي رسالتك لـ Robaty هنا..."
                    class="gold-input"
                    id="messageInput"
                    autocomplete="off"
                    rows="1"
                    data-i18n-placeholder="message_placeholder"
                ></textarea>

            </div>


            <div class="ornate-action-bar">

                <!-- SEND -->

                <button
                    type="button"
                    class="ornate-action-btn send-highlight"
                    id="sendButton"
                >

                    <i class="fa-solid fa-paper-plane"></i>

                    <span data-i18n="send_btn">
                        إرسال
                    </span>

                </button>


                <!-- RECORD -->

                <button
                    type="button"
                    class="ornate-action-btn record-btn"
                    id="recordButton"
                >

                    <i class="fa-solid fa-microphone"></i>

                    <span id="recordLabel" data-i18n="record_btn">
                        تسجيل صوتي
                    </span>

                </button>


                <!-- IMAGE -->

                <button
                    type="button"
                    class="ornate-action-btn image-btn"
                    id="imageButton"
                >

                    <i class="fa-regular fa-image"></i>

                    <span data-i18n="send_image_btn">
                        إرسال الصور
                    </span>

                </button>

            </div>


            <!-- HIDDEN IMAGE PICKER -->

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

        </footer>


        <!-- SETTINGS MODAL (لغة + مفتاح API) -->

        <div
            class="api-key-modal-overlay"
            id="apiKeyModal"
            aria-hidden="true"
        >

            <div class="api-key-modal-box">

                <h2 data-i18n="settings_title">⚙️ الإعدادات</h2>

                <!-- قسم اللغة -->
                <div class="settings-section">
                    <p class="settings-section-title" data-i18n="language_section_title">🌐 اللغة</p>
                    <div class="lang-options" id="languageOptions"></div>
                </div>

                <!-- قسم أجواء الألوان -->
                <div class="settings-section">
                    <p class="settings-section-title" data-i18n="color_mood_title">🎨 أجواء الألوان</p>
                    <div class="color-options" id="colorModeOptions">
                        <button type="button" class="color-option" data-color-value="default" data-i18n="color_default_label">🟤 الافتراضي (بني/ذهبي)</button>
                        <button type="button" class="color-option" data-color-value="vivid" data-i18n="color_vivid_label">🔵 أزرق/بنفسجي</button>
                        <button type="button" class="color-option" data-color-value="emerald" data-i18n="color_emerald_label">🟢 أخضر ملكي</button>
                        <button type="button" class="color-option" data-color-value="cream" data-i18n="color_cream_label">🤍 كريمي فاتح</button>
                        <button type="button" class="color-option" data-color-value="rose" data-i18n="color_rose_label">🌸 وردي أنيق</button>
                    </div>
                </div>

                <!-- قسم مفتاح API -->
                <div class="settings-section">
                    <p class="settings-section-title" data-i18n="api_key_title">🔑 مفتاح Gemini API</p>
                    <p data-i18n="api_key_desc">
                        باش تخدمي Robaty، خاصك تدخلي مفتاح Gemini API ديالك
                        (تقدري تجيبيه مجاناً من Google AI Studio).
                    </p>

                    <input
                        type="password"
                        id="apiKeyInput"
                        class="gold-input"
                        placeholder="الصقي المفتاح هنا..."
                        autocomplete="off"
                        style="margin-bottom:12px; width:100%;"
                        data-i18n-placeholder="api_key_placeholder"
                    >

                    <button
                        type="button"
                        class="gold-pill-btn"
                        id="saveApiKeyBtn"
                        style="width:100%; justify-content:center; display:flex;"
                        data-i18n="save_btn"
                    >
                        حفظ
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>


<script src="i18n.js"></script>
<script src="moments-data.js"></script>
<script src="moments-button-glow.js"></script>
<script src="app.js"></script>

</body>
</html>
