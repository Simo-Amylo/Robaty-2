<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- تطبيق اللغة/الاتجاه المحفوظين بكري، قبل ما تبان الصفحة (يمنع فلاش الاتجاه الغالط) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('robaty_lang');
                if (saved) {
                    document.documentElement.lang = saved;
                    document.documentElement.dir = (saved === 'ar') ? 'rtl' : 'ltr';
                }
            } catch (e) {}
        })();
    </script>

    <title>Robaty - Moroccan Luxury UI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Cairo: عربية/لاتينية. Roboto: زايدة كـ fallback باش تغطي السيريلية (الروسية) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>

<div class="outer-gold-frame">

    <!-- GOLDEN FRAME GLINT -->

    <div
        class="golden-ambient-glow"
        aria-hidden="true"
    ></div>


    <div class="app-container">

        <div class="corner-ornament top-left"></div>
        <div class="corner-ornament top-right"></div>
        <div class="corner-ornament bottom-left"></div>
        <div class="corner-ornament bottom-right"></div>


        <!-- TOP BAR -->

        <header class="top-bar">

            <button
                type="button"
                class="ornate-btn"
                id="backButton"
                aria-label="رجوع"
                data-i18n-aria="back_button_aria"
            >
                <i class="fa-solid fa-arrow-right"></i>
            </button>


            <div class="top-bar-right-group">

                <button
                    type="button"
                    class="ornate-btn ornate-btn-danger"
                    id="resetMemoryButton"
                    aria-label="مسح الذاكرة (مؤقت، للاختبار)"
                    title="مسح الذاكرة (مؤقت، للاختبار)"
                    data-i18n-aria="reset_memory_aria"
                    data-i18n-title="reset_memory_aria"
                >
                    <i class="fa-solid fa-trash"></i>
                </button>

                <button
                    type="button"
                    class="ornate-btn"
                    id="settingsButton"
                    aria-label="الإعدادات"
                    data-i18n-aria="settings_aria"
                >
                    <i class="fa-solid fa-gear"></i>
                </button>

            </div>

        </header>


        <!-- ROBATY PROFILE -->

        <section class="profile-section">

            <div class="avatar-container">

                <div class="zellige-mandala"></div>

                <div class="glowing-ring">

                    <div class="avatar-inner">

                        <img
                            id="avatarImgA"
                            src="robaty-profile.jpg"
                            alt="Robaty"
                            class="avatar-img is-active"
                        >

                        <img
                            id="avatarImgB"
                            alt="Robaty"
                            class="avatar-img"
                        >

                    </div>

                </div>

            </div>


            <div class="identity-info">

                <h1 class="bot-name">

                    <span
                        class="neon-target-ring"
                        id="presenceIndicator"
                    ></span>

                    Robaty

                </h1>


                <div class="divider-line">

                    <span class="line"></span>

                    <span class="tagline-star">۞</span>

                    <p class="tagline" data-i18n="tagline">
                        🇲🇦 مغربية و أفتخر
                    </p>

                    <span class="tagline-star">۞</span>

                    <span class="line"></span>

                </div>

            </div>


            <a
                href="moments.html"
                class="gold-pill-btn"
            >

                <i class="fa-regular fa-image"></i>

                <span data-i18n="view_moments_btn">شوفي تصاوري ليوم</span>

            </a>

        </section>


        <!-- CHAT AREA -->

        <main
            class="chat-area"
            id="chatArea"
        >

            <!-- الرسائل كتتزاد هنا ديناميكياً من app.js -->

        </main>


        <!-- BOTTOM CONTROLS -->

        <footer class="bottom-controls">

            <div class="input-wrapper">

                <!-- IMAGE THUMBNAIL -->

                <div
                    class="image-preview"
                    id="imagePreview"
                    aria-hidden="true"
                >

                    <img
                        id="previewImage"
                        src=""
                        alt="الصورة المختارة"
                        data-i18n-alt="selected_image_alt"
                    >

                    <button
                        type="button"
                        class="remove-image-btn"
                        id="removeImageBtn"
                        aria-label="حذف الصورة"
                        data-i18n-aria="remove_image_aria"
                    >

                        <i class="fa-solid fa-xmark"></i>

                    </button>

                </div>


                <!-- MESSAGE INPUT -->

                <textarea
                    placeholder="اكتبي رسالتك لـ Robaty هنا..."
                    class="gold-input"
                    id="messageInput"
                    autocomplete="off"
                    rows="1"
                    data-i18n-placeholder="message_placeholder"
                ></textarea>

            </div>


            <div class="ornate-action-bar">

                <!-- SEND -->

                <button
                    type="button"
                    class="ornate-action-btn send-highlight"
                    id="sendButton"
                >

                    <i class="fa-solid fa-paper-plane"></i>

                    <span data-i18n="send_btn">
                        إرسال
                    </span>

                </button>


                <!-- RECORD -->

                <button
                    type="button"
                    class="ornate-action-btn record-btn"
                    id="recordButton"
                >

                    <i class="fa-solid fa-microphone"></i>

                    <span id="recordLabel" data-i18n="record_btn">
                        تسجيل صوتي
                    </span>

                </button>


                <!-- IMAGE -->

                <button
                    type="button"
                    class="ornate-action-btn image-btn"
                    id="imageButton"
                >

                    <i class="fa-regular fa-image"></i>

                    <span data-i18n="send_image_btn">
                        إرسال الصور
                    </span>

                </button>

            </div>


            <!-- HIDDEN IMAGE PICKER -->

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

        </footer>


        <!-- SETTINGS MODAL (لغة + مفتاح API) -->

        <div
            class="api-key-modal-overlay"
            id="apiKeyModal"
            aria-hidden="true"
        >

            <div class="api-key-modal-box">

                <h2 data-i18n="settings_title">⚙️ الإعدادات</h2>

                <!-- قسم اللغة -->
                <div class="settings-section">
                    <p class="settings-section-title" data-i18n="language_section_title">🌐 اللغة</p>
                    <div class="lang-options" id="languageOptions"></div>
                </div>

                <!-- قسم أجواء الألوان -->
                <div class="settings-section">
                    <p class="settings-section-title" data-i18n="color_mood_title">🎨 أجواء الألوان</p>
                    <label
                        for="vividThemeToggle"
                        style="display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;"
                    >
                        <span data-i18n="vivid_theme_label">
                            أجواء ملونة (أزرق فالنهار، بنفسجي فالليل) — بدل البني/الذهبي الافتراضي
                        </span>
                        <input type="checkbox" id="vividThemeToggle">
                    </label>
                </div>

                <!-- قسم مفتاح API -->
                <div class="settings-section">
                    <p class="settings-section-title" data-i18n="api_key_title">🔑 مفتاح Gemini API</p>
                    <p data-i18n="api_key_desc">
                        باش تخدمي Robaty، خاصك تدخلي مفتاح Gemini API ديالك
                        (تقدري تجيبيه مجاناً من Google AI Studio).
                    </p>

                    <input
                        type="password"
                        id="apiKeyInput"
                        class="gold-input"
                        placeholder="الصقي المفتاح هنا..."
                        autocomplete="off"
                        style="margin-bottom:12px; width:100%;"
                        data-i18n-placeholder="api_key_placeholder"
                    >

                    <button
                        type="button"
                        class="gold-pill-btn"
                        id="saveApiKeyBtn"
                        style="width:100%; justify-content:center; display:flex;"
                        data-i18n="save_btn"
                    >
                        حفظ
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>


<script src="i18n.js"></script>
<script src="app.js"></script>

</body>
</html>
