    <style>
/* === Splash === */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #14100c;               /* نفس background_color في manifest */
    overflow: hidden;
    transition: opacity .35s ease, transform .35s ease;
  }
  #splash.leaving { opacity: 0; transform: scale(1.03); pointer-events: none; }

  /* الواجهة اللي تحت السبلاش كتبقى مخبية (visibility) حتى يسالي، باش المتصفح ما يرسمش
     أنيميشنات الإطار الذهبي والهالات وهي مغطية. هادشي هو اللي كان كيثقل ويقطع السبلاش. */
  html.splash-on body > *:not(#splash):not(script) { visibility: hidden; }

  /* الهالة الذهبية (كما هي) */
  .splash-glow {
    position: absolute; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(229,179,92,.30) 0%, rgba(229,179,92,.10) 45%, transparent 70%);
    opacity: 0;
  }
  #splash.go .splash-glow { animation: glow 1.6s ease-out .3s forwards; }
  @keyframes glow {
    0%   { opacity: 0; transform: scale(.7); }
    60%  { opacity: 1; transform: scale(1.05); }
    100% { opacity: .75; transform: scale(1); }
  }

  /* 0 → 1s : الصورة (234px = 130 + 80%) */
  /* إطار ذهبي بنفس .glowing-ring ديال شاشة المحادثات: padding 4px + gradient 135deg + هالة
     (242px = 234 للصورة + 4px من كل جهة، باش الصورة تبقى بنفس الحجم) */
  .splash-logo {
    position: relative; width: 242px; height: 242px; box-sizing: border-box;
    border-radius: 50%; padding: 4px;
    background: linear-gradient(135deg, #ffc875, #805018);
    box-shadow:
      0 0 34px rgba(255,170,51,.48),
      inset 0 0 34px rgba(255,170,51,.48);
    opacity: 0; transform: scale(.92);
  }
  .splash-face-wrap {
    position: relative; width: 100%; height: 100%;
    border-radius: 50%; overflow: hidden;
    background: #14100c;   /* الصور شفافة: الداخل غامق، والذهبي يبقى غير فالحافة */
  }
  /* 3 صور متراكبة (نفس تقنية crossfade ديال المحادثات): الجديدة كتظهر فوق القديمة
     والقديمة كتبقى كاملة تحتها، بلا وميض ولا فراغ */
  .splash-face {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover; display: block;
    opacity: 0; will-change: opacity;
  }
  .splash-face.f1 { opacity: 1; z-index: 1; }   /* calm */
  .splash-face.f2 { z-index: 2; }                /* warmth */
  .splash-face.f3 { z-index: 3; }                /* smile */
  /* crossfade linear بحال المحادثات، كله فـCSS (opacity كتتنفذ على الـcompositor
     يعني ما كتتأثرش إيلا الـmain thread كان مشغول بتحميل السكريبتات) */
  #splash.go .splash-face.f2 { animation: faceIn 1.4s linear 1.8s forwards; }
  #splash.go .splash-face.f3 { animation: faceIn 1.4s linear 3.4s forwards; }
  @keyframes faceIn { from { opacity: 0; } to { opacity: 1; } }
  #splash.go .splash-logo { animation: logoIn 1s cubic-bezier(.2,.7,.2,1) 0s forwards; }
  @keyframes logoIn { to { opacity: 1; transform: scale(1); } }

  /* 1 → 2s : الاسم (41px = 34 + 20%) */
  .splash-name {
    position: relative; margin: 22px 0 0;
    font: 600 41px/1.1 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .04em; color: #f5ecdc; direction: ltr;
    opacity: 0; transform: translateY(6px);
  }
  .splash-name span { color: #e5b35c; }
  #splash.go .splash-name { animation: rise 1s ease 1s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* 2 → 4s : الجملة (20.4px = 17 + 20%) */
  .splash-tagline {
    position: relative; margin: 12px 0 0; display: flex; align-items: center; gap: 10px;
    font: 400 20.4px/1.4 "Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    color: #f5ecdc;
  }
  /* "الكتابة": clip-path بهوامش عمودية سالبة، باش النقاط اللي كتخرج على سطر النص العربي
     (ي، ق، ن...) تبقى مخبية حتى يوصلها الكشف، وما تبانش بوحدها */
  .splash-tagline { clip-path: inset(-24px 0 -24px 100%); }
  html[dir="ltr"] .splash-tagline { clip-path: inset(-24px 100% -24px 0); }
  #splash.go .splash-tagline { animation: reveal 2s steps(24, end) 2s forwards; }
  @keyframes reveal { to { clip-path: inset(-24px 0 -24px 0); } }
  .splash-flag { width: 26px; height: 18px; border-radius: 2px; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    #splash .splash-glow, #splash .splash-logo, #splash .splash-name, #splash .splash-tagline {
      animation: none; opacity: 1; transform: none; clip-path: none;
    }
    #splash .splash-face.f2, #splash .splash-face.f3 { animation: none; }
    #splash { transition: opacity .2s ease; }
    #splash.leaving { transform: none; }
  }
</style>

<script>
(function () {
  var splash = document.getElementById('splash');
  if (!splash) return;
  var started = false;
  document.documentElement.classList.add('splash-on');

  function finish() {
    document.documentElement.classList.remove('splash-on');   // الواجهة تبان تحت السبلاش وهو كيتمسح
    splash.classList.add('leaving');
    setTimeout(function () {
      splash.remove();
      document.dispatchEvent(new Event('splash:done'));
    }, 380);
  }

  function start() {
    if (started) return;
    started = true;
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // ننتظر إطارين ليكون السبلاش ظاهراً فعلاً قبل بدء الأنيميشن
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        splash.classList.add('go');
        if (reduced) { setTimeout(finish, 600); return; }
        // كل الأنيميشن فـCSS (.go). calm 0→1.8s ← crossfade لـwarmth ← crossfade لـsmile (3.4→4.8s)
        setTimeout(finish, 6200);
      });
    });
  }

  var faces = splash.querySelectorAll('.splash-face');
  var decoded = Promise.all(Array.prototype.map.call(faces, function (el) {
    return el.decode ? el.decode().catch(function () {}) : Promise.resolve();
  }));
  var domReady = new Promise(function (res) {
    if (document.readyState !== 'loading') res();
    else document.addEventListener('DOMContentLoaded', res);
  });
  // نبداو غير ملي السكريبتات الثقيلة (app.js...) تكمل التنفيذ وتتفك الصور،
  // باش الأنيميشن ما يتقطعش ولا يقفز. احتياط: 3s
  Promise.all([decoded, domReady]).then(start, start);
  setTimeout(start, 3000);
})();
</script>

<!-- زر تثبيت التطبيق (فالهيدر): كيبين تقدم "التحميل" وكيتخبى ملي يتثبت التطبيق -->
<script>
(function () {
    var btn = document.getElementById('installButton');
    if (!btn) return;

    var isInstalled =
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
    if (isInstalled) return;

    var icon = btn.querySelector('i');
    var ring = btn.querySelector('.install-ring');
    var circle = btn.querySelector('.install-ring circle');
    var CIRC = 103.67;
    var PROGRESS_MS = 12000;   // مدة الحلقة (التثبيت كيدوز تقريبا 10 ثواني)
    var GIVE_UP_MS = 45000;    // إلا ما وصل حتى حدث تثبيت، نرجعو الزر لحالتو الأولى
    var IDLE_ICON = 'fa-solid fa-download';

    var busy = false;
    var giveUpTimer = null;
    var deferredPrompt = null;

    function tr(key, fallback) {
        try {
            if (window.RobatyI18n) {
                var v = window.RobatyI18n.t(key);
                if (v && v !== key) return v;
            }
        } catch (e) {}
        return fallback;
    }

    btn.style.display = '';

    function startProgress() {
        busy = true;
        btn.style.pointerEvents = 'none';
        btn.setAttribute('aria-busy', 'true');
        icon.className = 'fa-solid fa-circle-notch fa-spin';
        ring.style.opacity = '1';

        circle.style.transition = 'none';
        circle.style.strokeDashoffset = CIRC;
        void circle.getBoundingClientRect();
        circle.style.transition = 'stroke-dashoffset ' + PROGRESS_MS + 'ms linear';
        circle.style.strokeDashoffset = '0';

        clearTimeout(giveUpTimer);
        giveUpTimer = setTimeout(resetButton, GIVE_UP_MS);
    }

    function resetButton() {
        busy = false;
        clearTimeout(giveUpTimer);
        btn.style.pointerEvents = '';
        btn.removeAttribute('aria-busy');
        icon.className = IDLE_ICON;
        ring.style.opacity = '0';
        circle.style.transition = 'none';
        circle.style.strokeDashoffset = CIRC;
    }

    function finishInstall() {
        clearTimeout(giveUpTimer);
        busy = false;
        btn.style.pointerEvents = 'none';
        ring.style.opacity = '1';
        circle.style.transition = 'stroke-dashoffset .35s ease-out';
        circle.style.strokeDashoffset = '0';
        icon.className = 'fa-solid fa-check';
        setTimeout(function () { btn.style.display = 'none'; }, 2200);
    }

    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
    });

    window.addEventListener('appinstalled', finishInstall);

    function showSteps() {
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.72);';

        var card = document.createElement('div');
        card.setAttribute('role', 'dialog');
        card.setAttribute('aria-modal', 'true');
        card.style.cssText = 'width:100%;max-width:320px;padding:20px 18px;border-radius:20px;background:#1e1712;border:1px solid rgba(229,179,92,0.55);color:#f2f2f2;font-size:14px;line-height:2;box-shadow:0 10px 40px rgba(0,0,0,0.6);';

        var title = document.createElement('div');
        title.style.cssText = 'font-weight:700;font-size:16px;color:#e5b35c;margin-bottom:10px;text-align:center;';
        title.textContent = tr('install_title', '📲 تثبيت التطبيق');
        card.appendChild(title);

        var steps = [
            tr('install_step1', 'حلي قائمة المتصفح ⋮'),
            tr('install_step2', 'اختاري «إضافة إلى الشاشة الرئيسية»'),
            tr('install_step3', 'أكدي التثبيت')
        ];
        steps.forEach(function (st, i) {
            var line = document.createElement('div');
            line.textContent = (i + 1) + '. ' + st;
            card.appendChild(line);
        });

        function close() {
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }

        var ok = document.createElement('button');
        ok.type = 'button';
        ok.textContent = 'OK';
        ok.style.cssText = 'display:block;margin:14px auto 0;padding:8px 28px;border-radius:18px;border:1px solid rgba(229,179,92,0.6);background:transparent;color:#e5b35c;font-weight:700;font-size:14px;';
        ok.addEventListener('click', close);
        card.appendChild(ok);

        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) close();
        });

        overlay.appendChild(card);
        document.body.appendChild(overlay);
    }

    btn.addEventListener('click', function () {
        if (busy) return;

        if (deferredPrompt) {
            var promptEvent = deferredPrompt;
            deferredPrompt = null;
            promptEvent.prompt();
            promptEvent.userChoice.then(function (choice) {
                if (choice && choice.outcome === 'accepted') {
                    startProgress();
                }
            });
        } else {
            showSteps();
        }
    });
})();
</script>
