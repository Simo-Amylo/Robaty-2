<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robaty — مغربية و أفتخر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="outer-gold-frame">

    <!-- Golden Ambient Glint — frame only -->
    <div class="golden-ambient-glow"></div>

    <div class="app-container">

      <!-- TOP BAR -->
      <div class="top-bar">

        <button class="ornate-button" id="settingsBtn" aria-label="الإعدادات">
          ⚙
        </button>

        <button class="ornate-button" id="backBtn" aria-label="رجوع">
          ←
        </button>

      </div>

      <!-- PROFILE -->
      <div class="profile-section">

        <div class="glowing-ring">
          <img
            src="robaty-profile.jpg"
            alt="Robaty"
            class="avatar-img"
          >
        </div>

        <div class="profile-info">

          <div class="name-row">

            <span class="robaty-name">
              Robaty
            </span>

            <!-- Official Presence Indicator -->
            <span
              class="neon-target-ring"
              id="presenceIndicator"
              aria-label="Robaty presence"
            ></span>

          </div>

          <div class="tagline">
            🇲🇦 مغربية و أفتخر
          </div>

        </div>

      </div>

      <!-- MOMENTS BUTTON -->
      <button class="moment-button" id="momentButton">
        شوفي تصاوري ليوم
      </button>

      <!-- CHAT -->
      <main class="chat-area" id="chatArea">

        <div class="message bot-msg">
          سلام 👋 أنا Robaty 🇲🇦
          <br>
          كيف دايرة اليوم؟
        </div>

      </main>

      <!-- IMAGE PREVIEW -->
      <div
        class="image-preview-container"
        id="imagePreviewContainer"
        hidden
      >
        <div class="image-preview-wrapper">

          <img
            id="imagePreview"
            src=""
            alt="الصورة المختارة"
          >

          <button
            class="remove-image-btn"
            id="removeImageBtn"
            aria-label="حذف الصورة"
          >
            ×
          </button>

        </div>
      </div>

      <!-- BOTTOM COMPOSER -->
      <div class="bottom-section">

        <div class="input-row">

          <input
            type="text"
            id="messageInput"
            placeholder="كتبي لروباتي..."
            autocomplete="off"
          >

          <!-- SEND -->
          <button
            class="action-button send-button"
            id="sendButton"
            aria-label="إرسال"
          >
            <span>➤</span>
          </button>

          <!-- RECORD -->
          <button
            class="action-button record-button"
            id="recordButton"
            aria-label="تسجيل صوتي"
          >
            <span>🎙</span>
          </button>

          <!-- IMAGE -->
          <button
            class="action-button image-button"
            id="imageButton"
            aria-label="إرسال الصور"
          >
            <span>🖼</span>
          </button>

          <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          >

        </div>

        <div
          class="recording-status"
          id="recordingStatus"
          aria-live="polite"
        ></div>

      </div>

    </div>
  </div>


  <script>

    /* =========================================================
       ROBATY — PRESENCE SYSTEM
       IDLE → LISTENING → PROCESSING → SPEAKING → IDLE
    ========================================================= */

    const presenceIndicator =
      document.getElementById("presenceIndicator");

    let currentPresenceState = "idle";

    function setPresenceState(state) {

      const states = [
        "presence-listening",
        "presence-processing",
        "presence-speaking"
      ];

      presenceIndicator.classList.remove(...states);

      currentPresenceState = state;

      if (state !== "idle") {
        presenceIndicator.classList.add(
          `presence-${state}`
        );
      }
    }


    /* Public API for future Robaty AI / TTS connection */

    window.RobatyPresence = {

      idle() {
        setPresenceState("idle");
      },

      listening() {
        setPresenceState("listening");
      },

      processing() {
        setPresenceState("processing");
      },

      speaking() {
        setPresenceState("speaking");
      }

    };


    /* =========================================================
       CHAT
    ========================================================= */

    const chatArea =
      document.getElementById("chatArea");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");


    function addUserMessage(text) {

      if (!text.trim()) return;

      const message =
        document.createElement("div");

      message.className = "message user-msg";

      message.textContent = text;

      chatArea.appendChild(message);

      chatArea.scrollTop =
        chatArea.scrollHeight;
    }


    function addBotMessage(text) {

      const message =
        document.createElement("div");

      message.className = "message bot-msg";

      message.innerHTML = text;

      chatArea.appendChild(message);

      chatArea.scrollTop =
        chatArea.scrollHeight;
    }


    function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) return;

      addUserMessage(text);

      messageInput.value = "";

      /*
        Processing demo.
        Later this timeout will be replaced by
        the real AI response lifecycle.
      */

      setPresenceState("processing");

      setTimeout(() => {

        addBotMessage(
          "أنا معاك 👑✨"
        );

        setPresenceState("idle");

      }, 1200);
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {
          event.preventDefault();
          sendMessage();
        }

      }
    );


    /* =========================================================
       RECORDING + LISTENING PRESENCE
    ========================================================= */

    const recordButton =
      document.getElementById("recordButton");

    const recordingStatus =
      document.getElementById("recordingStatus");

    let mediaRecorder = null;
    let recordedChunks = [];

    let microphoneStream = null;

    let audioContext = null;
    let analyser = null;
    let animationFrame = null;


    async function startVoiceAnalysis(stream) {

      try {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        const source =
          audioContext.createMediaStreamSource(
            stream
          );

        analyser =
          audioContext.createAnalyser();

        analyser.fftSize = 256;

        analyser.smoothingTimeConstant = 0.82;

        source.connect(analyser);

        const data =
          new Uint8Array(
            analyser.fftSize
          );


        function analyseVoice() {

          if (!analyser) return;

          analyser.getByteTimeDomainData(data);

          let sum = 0;

          for (let i = 0; i < data.length; i++) {

            const normalized =
              (data[i] - 128) / 128;

            sum +=
              normalized * normalized;
          }

          const rms =
            Math.sqrt(
              sum / data.length
            );


          /*
            Convert microphone level to a subtle
            0 → 1 range.

            The maximum is deliberately capped
            so the indicator never becomes annoying.
          */

          let voiceLevel =
            Math.min(
              1,
              Math.max(
                0,
                (rms - 0.015) / 0.16
              )
            );


          voiceLevel =
            Math.min(
              0.68,
              voiceLevel
            );


          presenceIndicator.style.setProperty(
            "--voice-level",
            voiceLevel.toFixed(3)
          );


          animationFrame =
            requestAnimationFrame(
              analyseVoice
            );
        }


        analyseVoice();

      } catch (error) {

        console.warn(
          "Robaty voice analysis unavailable:",
          error
        );

      }
    }


    function stopVoiceAnalysis() {

      if (animationFrame) {

        cancelAnimationFrame(
          animationFrame
        );

        animationFrame = null;
      }

      if (audioContext) {

        audioContext.close()
          .catch(() => {});

        audioContext = null;
      }

      analyser = null;

      presenceIndicator.style.setProperty(
        "--voice-level",
        "0"
      );
    }


    async function startRecording() {

      try {

        recordedChunks = [];

        microphoneStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });


        mediaRecorder =
          new MediaRecorder(
            microphoneStream
          );


        mediaRecorder.ondataavailable =
          (event) => {

            if (
              event.data &&
              event.data.size > 0
            ) {

              recordedChunks.push(
                event.data
              );

            }

          };


        mediaRecorder.onstop =
          () => {

            const audioBlob =
              new Blob(
                recordedChunks,
                {
                  type: "audio/webm"
                }
              );

            const audioURL =
              URL.createObjectURL(
                audioBlob
              );


            const audioElement =
              document.createElement("audio");

            audioElement.controls = true;

            audioElement.src =
              audioURL;

            audioElement.className =
              "recorded-audio";


            const message =
              document.createElement("div");

            message.className =
              "message user-msg audio-msg";

            message.appendChild(
              audioElement
            );

            chatArea.appendChild(
              message
            );

            chatArea.scrollTop =
              chatArea.scrollHeight;

          };


        mediaRecorder.start();

        recordButton.classList.add(
          "recording-active"
        );

        recordingStatus.textContent =
          "Robaty كتسمعك... 🎙";


        /*
          Same microphone stream is used
          for recording + Presence analysis.
        */

        setPresenceState(
          "listening"
        );

        await startVoiceAnalysis(
          microphoneStream
        );


      } catch (error) {

        console.warn(error);

        recordingStatus.textContent =
          "الميكروفون ما قدرش يتفتح.";

        setPresenceState("idle");

      }

    }


    function stopRecording() {

      if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
      ) {

        mediaRecorder.stop();

      }


      if (microphoneStream) {

        microphoneStream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        microphoneStream = null;

      }


      stopVoiceAnalysis();

      recordButton.classList.remove(
        "recording-active"
      );

      recordingStatus.textContent = "";

      setPresenceState(
        "idle"
      );
    }


    /*
      Hold to record
    */

    recordButton.addEventListener(
      "pointerdown",
      async (event) => {

        event.preventDefault();

        await startRecording();

      }
    );


    recordButton.addEventListener(
      "pointerup",
      (event) => {

        event.preventDefault();

        stopRecording();

      }
    );


    recordButton.addEventListener(
      "pointercancel",
      () => {

        stopRecording();

      }
    );


    recordButton.addEventListener(
      "pointerleave",
      (event) => {

        /*
          Only stop when the pointer
          leaves while the button is active.
        */

        if (
          event.buttons > 0
        ) {

          stopRecording();

        }

      }
    );


    /* =========================================================
       IMAGE PICKER
    ========================================================= */

    const imageButton =
      document.getElementById("imageButton");

    const imageInput =
      document.getElementById("imageInput");

    const imagePreviewContainer =
      document.getElementById(
        "imagePreviewContainer"
      );

    const imagePreview =
      document.getElementById(
        "imagePreview"
      );

    const removeImageBtn =
      document.getElementById(
        "removeImageBtn"
      );


    imageButton.addEventListener(
      "click",
      () => {

        imageInput.click();

      }
    );


    imageInput.addEventListener(
      "change",
      () => {

        const file =
          imageInput.files[0];

        if (!file) return;

        const objectURL =
          URL.createObjectURL(
            file
          );

        imagePreview.src =
          objectURL;

        imagePreviewContainer.hidden =
          false;

      }
    );


    removeImageBtn.addEventListener(
      "click",
      () => {

        imagePreview.src = "";

        imageInput.value = "";

        imagePreviewContainer.hidden =
          true;

      }
    );


    /* =========================================================
       MOMENTS BUTTON
    ========================================================= */

    const momentButton =
      document.getElementById(
        "momentButton"
      );

    momentButton.addEventListener(
      "click",
      () => {

        /*
          Moments screen will be connected later.
        */

        momentButton.classList.add(
          "button-clicked"
        );

        setTimeout(() => {

          momentButton.classList.remove(
            "button-clicked"
          );

        }, 220);

      }
    );


    /* =========================================================
       TOP BUTTONS
    ========================================================= */

    document
      .getElementById("settingsBtn")
      .addEventListener(
        "click",
        () => {

          const button =
            document.getElementById(
              "settingsBtn"
            );

          button.classList.add(
            "button-clicked"
          );

          setTimeout(() => {

            button.classList.remove(
              "button-clicked"
            );

          }, 220);

        }
      );


    document
      .getElementById("backBtn")
      .addEventListener(
        "click",
        () => {

          const button =
            document.getElementById(
              "backBtn"
            );

          button.classList.add(
            "button-clicked"
          );

          setTimeout(() => {

            button.classList.remove(
              "button-clicked"
            );

          }, 220);

        }
      );


    /* =========================================================
       GOLDEN FRAME GLINT
       Very subtle — frame only
    ========================================================= */

    const goldenGlow =
      document.querySelector(
        ".golden-ambient-glow"
      );


    function triggerGoldenGlint() {

      if (!goldenGlow) return;

      const positions = [
        "top",
        "right",
        "bottom",
        "left"
      ];

      const position =
        positions[
          Math.floor(
            Math.random() *
            positions.length
          )
        ];


      goldenGlow.className =
        `golden-ambient-glow ${position}`;


      goldenGlow.classList.add(
        "active"
      );


      setTimeout(() => {

        goldenGlow.classList.remove(
          "active"
        );

      }, 1500);


      scheduleGoldenGlint();

    }


    function scheduleGoldenGlint() {

      const delay =
        14000 +
        Math.random() * 18000;

      setTimeout(
        triggerGoldenGlint,
        delay
      );

    }


    scheduleGoldenGlint();


  </script>

</body>
</html>
